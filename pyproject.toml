[project]
name = "dftlab"
version = "0.1.0"
description = "Computational physics library for density functional theory simulations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "basant", email = "acharya" }]
keywords = ["dft", "density functional theory", "computational physics", "materials science"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.25",
  "scipy>=1.12",
]
optional-dependencies = { dev = ["pytest>=8.0", "black", "ruff"], docs = ["sphinx", "sphinx-rtd-theme"] }

[project.urls]
"Homepage" = "https://github.com/yourusername/dftlab"
"Documentation" = "https://github.com/yourusername/dftlab#readme"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
